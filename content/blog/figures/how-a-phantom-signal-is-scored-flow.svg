<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>How a Phantom score is built</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>How a Phantom score is built</text>
<rect x='64.0' y='84' width='91.0' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='109.5' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Signals fire</text>
<line x1='159.0' y1='116.0' x2='175.0' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='175.0,111.0 181.0,116.0 175.0,121.0' fill='#8a948e'/>
<text x='109.5' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>8 indicators,</text>
<text x='109.5' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>classic</text>
<text x='109.5' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>signals,</text>
<text x='109.5' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>TradingView</text>
<text x='109.5' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>alerts</text>
<rect x='181.0' y='84' width='91.0' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='226.5' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>x learned</text>
<text x='226.5' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>weight</text>
<line x1='276.0' y1='116.0' x2='292.0' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='292.0,111.0 298.0,116.0 292.0,121.0' fill='#8a948e'/>
<text x='226.5' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>1.0 is</text>
<text x='226.5' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>neutral;</text>
<text x='226.5' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>weight depends</text>
<text x='226.5' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>on context</text>
<rect x='298.0' y='84' width='91.0' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='343.5' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>CALL vs PUT</text>
<text x='343.5' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>tally</text>
<line x1='393.0' y1='116.0' x2='409.0' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='409.0,111.0 415.0,116.0 409.0,121.0' fill='#8a948e'/>
<text x='343.5' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>bigger side</text>
<text x='343.5' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>wins; ties are</text>
<text x='343.5' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>rejected</text>
<rect x='415.0' y='84' width='91.0' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='460.5' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Bonuses and</text>
<text x='460.5' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>multipliers</text>
<line x1='510.0' y1='116.0' x2='526.0' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='526.0,111.0 532.0,116.0 526.0,121.0' fill='#8a948e'/>
<text x='460.5' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>PUT x1.10, +10</text>
<text x='460.5' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>agreement,</text>
<text x='460.5' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>regime bias</text>
<rect x='532.0' y='84' width='91.0' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='577.5' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>35 pts, 3</text>
<text x='577.5' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>signals,</text>
<text x='577.5' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>premium</text>
<line x1='627.0' y1='116.0' x2='643.0' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='643.0,111.0 649.0,116.0 643.0,121.0' fill='#8a948e'/>
<text x='577.5' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>or 2 signals</text>
<text x='577.5' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>when one is</text>
<text x='577.5' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>premium</text>
<rect x='649.0' y='84' width='91.0' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='694.5' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Confidence</text>
<text x='694.5' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>tier</text>
<text x='694.5' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>HIGH 80+,</text>
<text x='694.5' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>MEDIUM 50+,</text>
<text x='694.5' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>LOW below</text>
</svg>
