<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>The daily routine: the plan is read before the open and graded after the close</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>The daily routine: the plan is read before the open and graded after the close</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Pre-market:</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>read the plan</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>sleep logged; loss</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>limit and max</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>trades written</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>down; orders</text>
<text x='121.2' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>pre-staged</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Session: setups</text>
<text x='261.6' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>only</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>entry, stop and</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>size fixed by</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>rule; no trade</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>outside the</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>written setups</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Circuit breaker</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>daily loss limit</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>or two rule breaks</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>ends the session;</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>platform closed</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Post-market:</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>journal</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>every trade logged</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>within 30 min:</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>rule followed? R</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>result, MAE</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Weekly: review,</text>
<text x='682.8' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>rest</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>expectancy and</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>error bar</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>recomputed; one</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>change at most;</text>
<text x='682.8' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>screens off</text>
</svg>
