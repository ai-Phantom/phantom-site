<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>The research loop: the order is the discipline</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>The research loop: the order is the discipline</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Hypothesis</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>a market reason,</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>written before any</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>data is opened</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Rule</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>entry, exit, size,</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>execution</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>convention, all in</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>code</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Test</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>next-bar fills,</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>costs, truncation</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>check,</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>out-of-sample</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Decide</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>pass/fail against</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>thresholds fixed</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>in advance</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Record</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>log the result</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>even when it</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>fails; count the</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>attempt</text>
</svg>
