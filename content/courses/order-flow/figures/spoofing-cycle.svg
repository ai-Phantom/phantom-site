<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>A spoofing cycle: what the book shows versus what the trader wants</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>A spoofing cycle: what the book shows versus what the trader wants</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Rest a small</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>genuine buy</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>the order the</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>trader wants</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>filled</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Layer large</text>
<text x='261.6' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>sells above the</text>
<text x='261.6' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>ask</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>several large</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>orders, never</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>meant to trade</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Book looks</text>
<text x='402.0' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>heavy; sellers</text>
<text x='402.0' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>hit the bid</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>other participants</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>react to displayed</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>size</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Small buy</text>
<text x='542.4' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>fills; cancel</text>
<text x='542.4' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>the layers</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>cancellation</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>within</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>milliseconds of</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>the fill</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Mirror it to</text>
<text x='682.8' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>sell out</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>repeat on the</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>other side to exit</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>at a profit</text>
</svg>
