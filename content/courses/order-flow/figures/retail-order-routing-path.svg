<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>The path of a retail marketable order</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>The path of a retail marketable order</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>You send a</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>market order</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>broker chooses the</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>venue, not you</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>(Rule 606</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>discloses where)</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Broker&#x27;s router</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>more than 90% of</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>retail marketable</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>orders go to</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>wholesalers (SEC,</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>Dec 2022)</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Wholesaler or</text>
<text x='402.0' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>exchange</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>wholesaler fills</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>from inventory;</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>exchange matches</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>on its book</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>NBBO check</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>(Rule 611)</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>no fill through a</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>protected quote;</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>fee cap</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>$0.003/share (Rule</text>
<text x='542.4' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>610)</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Print and</text>
<text x='682.8' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>report</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>exchange trades</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>print on the SIP;</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>off-exchange</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>trades via a FINRA</text>
<text x='682.8' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>TRF</text>
</svg>
