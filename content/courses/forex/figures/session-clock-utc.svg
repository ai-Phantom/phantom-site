<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>The FX trading day in UTC (winter time)</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>The FX trading day in UTC (winter time)</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Sydney 22:00 to</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>07:00</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>week opens Sun</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>21:00 UTC; AUD,</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>NZD pairs; RBA</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>decisions</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Tokyo 00:00 to</text>
<text x='261.6' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>09:00</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>with Singapore</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>(11.8%) and Hong</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>Kong; BoJ</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>decisions ~03:00</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>UTC</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>London 08:00 to</text>
<text x='402.0' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>17:00</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>largest centre;</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>ECB decisions</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>13:15; London fix</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>16:00</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>New York 13:00</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>to 22:00</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>13:00-17:00</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>overlap with</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>London is deepest;</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>NFP, CPI 13:30;</text>
<text x='542.4' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>FOMC 19:00</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Rollover 22:00</text>
<text x='682.8' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>UTC</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>17:00 ET: swap</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>applied, spreads</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>widen briefly; Fri</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>22:00 close</text>
</svg>
