<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>Path of a retail FX order (turnover: BIS Triennial Survey, April 2025)</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>Path of a retail FX order (turnover: BIS Triennial Survey, April 2025)</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Your order</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>1 lot EUR/USD at</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>1.1411: $114,110</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>notional, bought</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>at the ask</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Dealer is the</text>
<text x='261.6' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>counterparty</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>NFA rule: FDM is</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>counterparty to</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>every trade; nets</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>clients, hedges</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>the rest</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Liquidity</text>
<text x='402.0' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>providers, ECNs</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>banks, non-bank</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>market makers;</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>$4.8trn/day, 50%</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>of turnover</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Interbank</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>platforms</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>EBS, Refinitiv</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>Matching;</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>inter-dealer</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>$4.4trn/day, 46%</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>CLS settlement</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>spot settles T+2</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>PvP; retail rolls</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>at 17:00 New York</text>
</svg>
