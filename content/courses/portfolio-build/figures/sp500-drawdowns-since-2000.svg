<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>S&amp;P 500: four largest price drawdowns since 2000</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>S&amp;P 500: four largest price drawdowns since 2000</text>
<line x1='64' y1='348.0' x2='740' y2='348.0' stroke='#2a3138' stroke-width='1'/>
<text x='56' y='352.0' fill='#8a948e' text-anchor='end'>-80%</text>
<line x1='64' y1='278.0' x2='740' y2='278.0' stroke='#2a3138' stroke-width='1'/>
<text x='56' y='282.0' fill='#8a948e' text-anchor='end'>-60%</text>
<line x1='64' y1='207.9' x2='740' y2='207.9' stroke='#2a3138' stroke-width='1'/>
<text x='56' y='211.9' fill='#8a948e' text-anchor='end'>-40%</text>
<line x1='64' y1='137.9' x2='740' y2='137.9' stroke='#2a3138' stroke-width='1'/>
<text x='56' y='141.9' fill='#8a948e' text-anchor='end'>-20%</text>
<line x1='64' y1='67.9' x2='740' y2='67.9' stroke='#2a3138' stroke-width='1'/>
<text x='56' y='71.9' fill='#8a948e' text-anchor='end'>+0%</text>
<line x1='64' y1='44' x2='64' y2='348' stroke='#3a434b'/>
<line x1='64' y1='348' x2='740' y2='348' stroke='#3a434b'/>
<text x='64' y='34' fill='#8a948e' font-size='11'>peak to trough, %</text>
<rect x='96.1' y='67.9' width='104.8' height='171.9' fill='#ff4d6a' rx='2'/>
<text x='148.5' y='253.8' fill='#c9d1cc' text-anchor='middle' font-size='11'>-49.1%</text>
<text x='148.5' y='366' fill='#8a948e' text-anchor='middle' font-size='11'>Mar 2000–Oct 2002</text>
<rect x='265.1' y='67.9' width='104.8' height='198.9' fill='#ff4d6a' rx='2'/>
<text x='317.5' y='280.8' fill='#c9d1cc' text-anchor='middle' font-size='11'>-56.8%</text>
<text x='317.5' y='366' fill='#8a948e' text-anchor='middle' font-size='11'>Oct 2007–Mar 2009</text>
<rect x='434.1' y='67.9' width='104.8' height='118.7' fill='#ff4d6a' rx='2'/>
<text x='486.5' y='200.6' fill='#c9d1cc' text-anchor='middle' font-size='11'>-33.9%</text>
<text x='486.5' y='366' fill='#8a948e' text-anchor='middle' font-size='11'>Feb–Mar 2020</text>
<rect x='603.1' y='67.9' width='104.8' height='88.9' fill='#ff4d6a' rx='2'/>
<text x='655.5' y='170.8' fill='#c9d1cc' text-anchor='middle' font-size='11'>-25.4%</text>
<text x='655.5' y='366' fill='#8a948e' text-anchor='middle' font-size='11'>Jan–Oct 2022</text>
