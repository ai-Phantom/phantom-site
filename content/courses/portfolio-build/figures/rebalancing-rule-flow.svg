<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>Rebalancing rule: check on the calendar, act on the threshold</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>Rebalancing rule: check on the calendar, act on the threshold</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Fixed check</text>
<text x='121.2' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>date, twice a</text>
<text x='121.2' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>year</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>No trades between</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>dates unless a</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>satellite hits its</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>stop</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Compare each</text>
<text x='261.6' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>weight to its</text>
<text x='261.6' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>target</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Core: ±5 points.</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>Satellite: ±25% of</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>its target weight</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Inside the</text>
<text x='402.0' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>band: do</text>
<text x='402.0' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>nothing</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Wait for the next</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>check date</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Outside: use</text>
<text x='542.4' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>cash flows</text>
<text x='542.4' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>first</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>New contributions,</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>dividends, the</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>cash reserve. No</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>sale, no tax</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Still outside:</text>
<text x='682.8' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>sell to target</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Highest-basis,</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>longest-held lots;</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>mind the 30-day</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>wash-sale rule</text>
</svg>
