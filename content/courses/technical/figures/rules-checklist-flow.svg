<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>A rules-based checklist: every part answerable yes or no from the data</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>A rules-based checklist: every part answerable yes or no from the data</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>1. Regime</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>filter</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Close above the</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>200-day SMA</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>2. Setup</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>RSI(2) below 10,</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>Wilder smoothing</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>3. Entry</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Next day&#x27;s open;</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>one position at a</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>time</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>4. Exit if</text>
<text x='542.4' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>wrong, exit if</text>
<text x='542.4' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>right</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Rule A: first</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>close above the</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>5-day SMA. Rule B:</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>1 ATR stop, 2 ATR</text>
<text x='542.4' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>target, 10 days</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='110' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>5. Size</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Shares = 0.5% of</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>account / (entry -</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>stop)</text>
</svg>
