<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>Form 1040-ES (2026): finding the required annual payment, IRC section 6654(d)</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>Form 1040-ES (2026): finding the required annual payment, IRC section 6654(d)</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Will you owe</text>
<text x='121.2' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>$1,000 or more</text>
<text x='121.2' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>after</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>no: no estimated</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>payments are</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>required; yes:</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>continue</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Was 2025 AGI</text>
<text x='261.6' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>above $150,000?</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>yes: prior-year</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>safe harbour is</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>110% of 2025 tax;</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>no: 100% ($75,000</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>if married filing</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Required annual</text>
<text x='402.0' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>payment = the</text>
<text x='402.0' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>smaller</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>of 90% of the 2026</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>tax or the</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>prior-year figure;</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>example:</text>
<text x='402.0' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>min(54,000,</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Pay one quarter</text>
<text x='542.4' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>by each due</text>
<text x='542.4' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>date</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>Apr 15, Jun 15,</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>Sep 15 2026 and</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>Jan 15 2027;</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>10,450 each in the</text>
<text x='542.4' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>example</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Income arrives</text>
<text x='682.8' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>late in the</text>
<text x='682.8' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>year?</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>annualise on Form</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>2210 Schedule AI</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>so early quarters</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>are not penalised</text>
<text x='682.8' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>for later gains</text>
</svg>
