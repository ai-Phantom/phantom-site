<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>Tax-loss harvesting: the questions in the order they are asked</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>Tax-loss harvesting: the questions in the order they are asked</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Position shows</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>a loss</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>compare proceeds</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>with adjusted</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>basis per lot; a</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>paper loss in one</text>
<text x='121.2' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>lot may hide a</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Taxable</text>
<text x='261.6' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>account?</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>a loss inside an</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>IRA or 401(k) is</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>never deductible;</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>only taxable</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>accounts harvest</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Any identical</text>
<text x='402.0' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>purchase within</text>
<text x='402.0' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>30 days either</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>all your accounts,</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>your spouse, your</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>IRA and options to</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>buy; if yes, the</text>
<text x='402.0' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>loss is deferred</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Sell and choose</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>the replacement</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>cash for 31 days,</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>a different-index</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>fund, or a</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>same-index fund</text>
<text x='542.4' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>from another</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Record and</text>
<text x='682.8' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>reconcile</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>date, lot, basis,</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>disallowed amount;</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>check the 1099-B</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>box 1g in the</text>
<text x='682.8' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>following February</text>
</svg>
