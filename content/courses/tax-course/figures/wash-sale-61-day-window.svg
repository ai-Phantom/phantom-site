<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>IRC section 1091: 30 days before, the sale day, 30 days after (61 days)</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>IRC section 1091: 30 days before, the sale day, 30 days after (61 days)</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>2025-03-05:</text>
<text x='121.2' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>window opens</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>30 days before the</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>sale; any purchase</text>
<text x='121.2' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>of substantially</text>
<text x='121.2' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>identical SPY from</text>
<text x='121.2' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>here counts</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>2025-04-04:</text>
<text x='261.6' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>sell 100 SPY at</text>
<text x='261.6' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>505.28</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>loss of $10,765 on</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>shares bought</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>2025-02-19 at</text>
<text x='261.6' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>612.93; loss is</text>
<text x='261.6' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>disallowed, not</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>2025-04-24: buy</text>
<text x='402.0' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>100 SPY at</text>
<text x='402.0' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>546.69</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>inside the window:</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>basis becomes</text>
<text x='402.0' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>54,669 + 10,765 =</text>
<text x='402.0' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>65,434; holding</text>
<text x='402.0' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>period tacks</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>2025-05-04:</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>window closes</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>30 days after the</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>sale; a purchase</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>on 2025-05-05</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>would not trigger</text>
<text x='542.4' y='230' fill='#8a948e' text-anchor='middle' font-size='11'>the rule</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>2025-12-01:</text>
<text x='682.8' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>sell</text>
<text x='682.8' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>replacement at</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>gain 68,027 -</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>65,434 = 2,593;</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>the deferred loss</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>is recognised here</text>
</svg>
