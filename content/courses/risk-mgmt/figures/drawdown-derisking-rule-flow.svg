<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' font-family='ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif' font-size='12'>
<title>Drawdown de-risking rule (tested on SPY, 2008 to 2025)</title>
<text x='64' y='24' fill='#c9d1cc' font-size='15' font-weight='700'>Drawdown de-risking rule (tested on SPY, 2008 to 2025)</text>
<rect x='64.0' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='121.2' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Mark NAV</text>
<text x='121.2' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>against its</text>
<text x='121.2' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>252-day peak</text>
<line x1='182.4' y1='116.0' x2='198.4' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='198.4,111.0 204.4,116.0 198.4,121.0' fill='#8a948e'/>
<text x='121.2' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>daily, at the</text>
<text x='121.2' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>close</text>
<rect x='204.4' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='261.6' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Drawdown under</text>
<text x='261.6' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>10%: full gross</text>
<line x1='322.8' y1='116.0' x2='338.8' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='338.8,111.0 344.8,116.0 338.8,121.0' fill='#8a948e'/>
<text x='261.6' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>2025: cut on 03-13</text>
<text x='261.6' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>at -10.0%,</text>
<text x='261.6' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>restored 05-13</text>
<rect x='344.8' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='402.0' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>10% to 20%:</text>
<text x='402.0' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>gross x 0.5</text>
<line x1='463.2' y1='116.0' x2='479.2' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='479.2,111.0 485.2,116.0 479.2,121.0' fill='#8a948e'/>
<text x='402.0' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>2020: cut 02-27 at</text>
<text x='402.0' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>-12.1%</text>
<rect x='485.2' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='542.4' y='103' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Over 20%: gross</text>
<text x='542.4' y='118' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>x 0</text>
<line x1='603.6' y1='116.0' x2='619.6' y2='116.0' stroke='#8a948e' stroke-width='2'/>
<polygon points='619.6,111.0 625.6,116.0 619.6,121.0' fill='#8a948e'/>
<text x='542.4' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>2020: flat 03-12</text>
<text x='542.4' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>at -26.7%, 7</text>
<text x='542.4' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>sessions before</text>
<text x='542.4' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>the low</text>
<rect x='625.6' y='84' width='114.4' height='64' rx='8' fill='#141a1f' stroke='#7eff5c' stroke-width='1.5'/>
<text x='682.8' y='96' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>Re-add only on</text>
<text x='682.8' y='111' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>a new 50-day</text>
<text x='682.8' y='126' fill='#c9d1cc' text-anchor='middle' font-size='12' font-weight='600'>high</text>
<text x='682.8' y='170' fill='#8a948e' text-anchor='middle' font-size='11'>2020: back in</text>
<text x='682.8' y='185' fill='#8a948e' text-anchor='middle' font-size='11'>05-20; rule +1.8%</text>
<text x='682.8' y='200' fill='#8a948e' text-anchor='middle' font-size='11'>vs +17.2%</text>
<text x='682.8' y='215' fill='#8a948e' text-anchor='middle' font-size='11'>buy-and-hold</text>
</svg>
